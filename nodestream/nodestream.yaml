# One graph for every CIBMTR public dataset.
# Run from this directory after `pip install -e .` and with Neo4j listening.
scopes:
  cibmtr:
    pipelines:
      - fields.yaml
      - studies.yaml
      - patients.yaml

targets:
  neo4j:
    database: neo4j
    uri: !env NEO4J_URI
    username: !env NEO4J_USERNAME
    password: !env NEO4J_PASSWORD
    database_name: neo4j
  dry-run:
    database: "null"
