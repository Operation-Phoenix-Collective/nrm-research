[project]
name = "cibmtr-nodestream"
version = "0.1.0"
description = "Ingest CIBMTR public SAS datasets into one Nodestream graph."
requires-python = ">=3.10"
dependencies = [
    "nodestream>=0.16,<0.17",
    "nodestream-plugin-neo4j>=0.16",
    "nodestream-plugin-sas @ git+https://github.com/ccloes/nodestream-plugin-sas.git",
    "pandas>=2",
]

[tool.setuptools.packages.find]
include = ["cibmtr*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
